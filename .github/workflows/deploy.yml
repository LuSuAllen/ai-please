name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 门禁在构建前跑：单测（生成器/评分器/存档/不变量）+ 不变量压力测试
      - run: npm test
      # enablement: true —— 仓库还没开 Pages 时，用工作流 token 自动开通（免去网页设置那一步）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
      # 预算门禁在构建后跑：首屏 JS ≤70kB、总产物 ≤260kB
      - run: npm run verify:budget
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
